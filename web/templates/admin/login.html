<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Administrativa | Liderança Conectada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="admin-login-body">
    <div class="admin-login-card">
        <img src="/static/images/lideranca_conectada.png" alt="Liderança Conectada" class="h-12 w-auto object-contain mx-auto mb-8">
        <h1 class="admin-login-title">Área Administrativa</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="admin-flash admin-flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST" class="admin-login-form">
            <div class="admin-field">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required autofocus>
            </div>
            <div class="admin-field">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>
            </div>
            <button type="submit" class="admin-btn admin-btn-primary admin-btn-block">Entrar</button>
        </form>
        <a href="/" class="admin-login-back">← Voltar ao site</a>
    </div>
</body>
</html>
