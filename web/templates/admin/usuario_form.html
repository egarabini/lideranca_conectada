{% extends "admin/base.html" %}
{% block title %}Novo Usuário{% endblock %}
{% block content %}
<div class="admin-page">
    <div class="admin-page-header">
        <h1 class="admin-page-title">Novo Usuário</h1>
    </div>
    <div class="admin-panel admin-panel-narrow">
        <form method="POST" class="admin-form">
            <div class="admin-field">
                <label for="nome">Nome *</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="admin-field">
                <label for="email">E-mail *</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="admin-field">
                <label for="senha">Senha *</label>
                <input type="password" id="senha" name="senha" required>
            </div>
            <div class="admin-form-actions">
                <a href="{{ url_for('admin.usuarios') }}" class="admin-btn admin-btn-ghost">Cancelar</a>
                <button type="submit" class="admin-btn admin-btn-primary">Criar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
