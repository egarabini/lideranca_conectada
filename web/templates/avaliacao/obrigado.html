<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrigado | Liderança Conectada 360 Graus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background: #FDFCFB; color: #4A4A4A; } .serif { font-family: 'Playfair Display', serif; }</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center px-6 text-center">
    <div class="w-20 h-20 rounded-full bg-[#D4A017]/15 flex items-center justify-center mb-8">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none"><path d="M12 20l6 6 10-12" stroke="#D4A017" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1 class="serif text-3xl text-[#5C2A2A] mb-4">Obrigado pela sua avaliação!</h1>
    <p class="text-gray-500 max-w-md mb-8">Sua opinião é fundamental para que possamos continuar evoluindo e entregando conteúdo de qualidade.</p>
    <p class="text-sm text-gray-400">{{ po.palestra_titulo }} — {{ po.organizacao_nome }}</p>
    <a href="/" class="mt-10 text-xs uppercase tracking-widest text-[#5C2A2A] hover:text-[#D4A017] transition">← Voltar ao site</a>
</body>
</html>
