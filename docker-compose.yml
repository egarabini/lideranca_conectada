services:
  db:
    image: postgres:15-alpine
    container_name: lc360_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: lc360_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy

  disc:
    build:
      context: ./disc_analise
    container_name: lc360_disc
    restart: unless-stopped
    ports:
      - "${DISC_PORT:-5173}:80"
    environment:
      DISC_BASIC_USER: ${DISC_BASIC_USER:-disc}
      DISC_BASIC_PASSWORD: ${DISC_BASIC_PASSWORD}
      VITE_OPENAI_API_KEY: ${VITE_OPENAI_API_KEY:-}
      VITE_OPENROUTER_API_KEY: ${VITE_OPENROUTER_API_KEY:-}
      VITE_GEMINI_API_KEY: ${VITE_GEMINI_API_KEY:-}
      VITE_ANTHROPIC_API_KEY: ${VITE_ANTHROPIC_API_KEY:-}
      VITE_OPENAI_MODEL: ${VITE_OPENAI_MODEL:-gpt-4o-mini}
      VITE_OPENROUTER_MODEL: ${VITE_OPENROUTER_MODEL:-openai/gpt-4o-mini}
      VITE_GEMINI_MODEL: ${VITE_GEMINI_MODEL:-gemini-1.5-flash}
      VITE_ANTHROPIC_MODEL: ${VITE_ANTHROPIC_MODEL:-claude-3-5-haiku-latest}

volumes:
  postgres_data:
